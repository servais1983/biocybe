# BioCybe — Déploiement local par docker-compose
# ===============================================
# Profil minimal pour dev / petit déploiement SOC.
# Pour la prod (systemd / Compose durci / Kubernetes), voir docs/deployment.md.
#
# Usage :
#   docker compose up -d              # démarre le daemon BioCybe
#   docker compose run --rm scanner scan /samples     # scan one-shot
#   docker compose down               # arrêt

services:
  # Daemon BioCybe : surveillance continue (cellules actives).
  biocybe:
    build:
      context: .
      dockerfile: Dockerfile
    image: biocybe:latest
    container_name: biocybe
    restart: unless-stopped
    # Le daemon est démarré sans sous-commande (= comportement par défaut).
    command: ["--config", "/home/biocybe/config/biocybe.yaml"]
    environment:
      BIOCYBE_CONFIG: /home/biocybe/config/biocybe.yaml
      BIOCYBE_LOG_FILE: /home/biocybe/logs/biocybe.log
      BIOCYBE_LOG_FORMAT: json
      BIOCYBE_LOG_LEVEL: INFO
      BIOCYBE_HEARTBEAT_FILE: /home/biocybe/logs/heartbeat
    volumes:
      - biocybe-quarantine:/home/biocybe/quarantine
      - biocybe-db:/home/biocybe/db
      - biocybe-logs:/home/biocybe/logs
      # Montez ici les dossiers à surveiller (ex. /var/log, /tmp, etc.) en lecture seule
      # - /var/log:/host/var/log:ro
    networks:
      - biocybe
    # Limites de ressources : un agent de sécurité ne doit jamais OOM l'hôte.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    # Sécurité : pas de privilèges, FS root en lecture seule sauf volumes.
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "/opt/biocybe/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # API REST (extra web). Ne démarre pas avec `docker compose up` :
  #   BIOCYBE_API_TOKEN=... docker compose --profile api up -d api
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BIOCYBE_EXTRAS: web
    image: biocybe:web
    container_name: biocybe-api
    restart: unless-stopped
    command: ["api", "serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      BIOCYBE_API_TOKEN: ${BIOCYBE_API_TOKEN:-}
      BIOCYBE_LOG_FORMAT: json
      BIOCYBE_LOG_LEVEL: INFO
      BIOCYBE_HEALTHCHECK_URL: http://127.0.0.1:8080/healthz
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - biocybe-quarantine:/home/biocybe/quarantine
      - biocybe-db:/home/biocybe/db
      - biocybe-logs:/home/biocybe/logs
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "/opt/biocybe/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Service one-shot pour scans ad-hoc.
  scanner:
    image: biocybe:latest
    container_name: biocybe-scanner
    profiles: ["tools"]   # ne démarre pas par défaut, doit être appelé via `docker compose run`
    volumes:
      - biocybe-quarantine:/home/biocybe/quarantine
      # Le dossier à scanner sera passé en argument et monté à l'appel.
    networks:
      - biocybe
    entrypoint: ["tini", "--", "biocybe", "scan"]
    command: ["--help"]

volumes:
  biocybe-quarantine:
  biocybe-db:
  biocybe-logs:

networks:
  biocybe:
    driver: bridge
